<style>
        .title{font:700 96px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#ecebe6;letter-spacing:-.02em}
        .tag{font:32px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#8f8b82}
        .m{font:28px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
