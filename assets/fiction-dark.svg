<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 652" width="880" height="652" role="img" aria-label="A short fiction passage with a stated theme highlighted, then a rewrite with named emotion, specifics and a time jump.">
<style>
    .card{fill:#151514;stroke:#2c2b28}
    .mono{font:17px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#ecebe6}
    .cap{font:600 12.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;letter-spacing:.12em;fill:#8f8b82}
    .sub{font:14px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#8f8b82}
    .label{font:15.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#ecebe6}
    .num{font:700 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#151514}
    .rule{stroke:#2c2b28}
    .t1,.t2,.t3{fill:#e2805f}
    .f1,.f2,.f3{fill:#6fc2a8}
    .t1-dot,.t2-dot,.t3-dot{fill:#e2805f}
    .f1-dot,.f2-dot,.f3-dot{fill:#6fc2a8}
    .before{opacity:.72}
    @keyframes ink{from{fill:#ecebe6}}
    @keyframes off{from{fill:#2c2b28}}
    @keyframes dim{from{opacity:1}}
    .t1,.t1-dot{animation:ink .35s ease-out .8s backwards}
    .t2,.t2-dot{animation:ink .35s ease-out 1.5s backwards}
    .t3,.t3-dot{animation:ink .35s ease-out 2.2s backwards}
    .before{animation:dim .6s ease-out 3s backwards}
    .f1,.f1-dot{animation:ink .35s ease-out 3.5s backwards}
    .f2,.f2-dot{animation:ink .35s ease-out 4.1s backwards}
    .f3,.f3-dot{animation:ink .35s ease-out 4.7s backwards}
    .t1-dot,.t2-dot,.t3-dot,.f1-dot,.f2-dot,.f3-dot{animation-name:off}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
    </style>
<rect class="card" x=".5" y=".5" width="879" height="651" rx="14"/>
<text x="48" y="58" class="cap">BEFORE</text>
<text x="832" y="58" class="sub" text-anchor="end">fiction</text>
<g class="before">
<text x="48" y="104" class="mono"><tspan>Maria stood at the edge of the pier as the sun sank.</tspan></text>
<text x="48" y="134" class="mono"><tspan class="t1">Her chest tightened with every wave,</tspan><tspan class="t1" dy="-7" font-size="12">1</tspan><tspan class="t2" dy="7"> the salt air</tspan></text>
<text x="48" y="164" class="mono"><tspan class="t2">carrying memories of her father.</tspan><tspan class="t2" dy="-7" font-size="12">2</tspan><tspan dy="7"> She had spent years</tspan></text>
<text x="48" y="194" class="mono"><tspan>running from this place. But now, </tspan><tspan class="t3">she finally</tspan></text>
<text x="48" y="224" class="mono"><tspan class="t3">understood: home was never a place. It was the</tspan></text>
<text x="48" y="254" class="mono"><tspan class="t3">people who had loved her.</tspan><tspan class="t3" dy="-7" font-size="12">3</tspan></text>
</g>
<circle cx="57" cy="315" r="10" class="t1-dot"/><text x="57" y="320" class="num" text-anchor="middle">1</text><text x="76" y="320" class="label">emotion only in the body</text><circle cx="319" cy="315" r="10" class="t2-dot"/><text x="319" y="320" class="num" text-anchor="middle">2</text><text x="338" y="320" class="label">generic imagery</text><circle cx="581" cy="315" r="10" class="t3-dot"/><text x="581" y="320" class="num" text-anchor="middle">3</text><text x="600" y="320" class="label">stated theme</text>
<line class="rule" x1="48" x2="832" y1="346" y2="346"/>
<text x="48" y="384" class="cap">AFTER</text>
<text x="48" y="414" class="mono"><tspan>The pier had been repainted, which </tspan><tspan class="f1">made her angry</tspan><tspan class="f1" dy="-7" font-size="12">1</tspan></text>
<text x="48" y="444" class="mono"><tspan>before she knew why. Her father had hated </tspan><tspan class="f2">that green</tspan><tspan>.</tspan></text>
<text x="48" y="474" class="mono"><tspan>She told the man at the </tspan><tspan class="f2">bait shop</tspan><tspan class="f2" dy="-7" font-size="12">2</tspan><tspan dy="7"> she was only passing</tspan></text>
<text x="48" y="504" class="mono"><tspan>through, and that was a lie too.</tspan></text>
<text x="48" y="534" class="mono"><tspan class="f3">Two winters earlier,</tspan><tspan class="f3" dy="-7" font-size="12">3</tspan><tspan dy="7"> she had sold his boat to a</tspan></text>
<text x="48" y="564" class="mono"><tspan>dentist from </tspan><tspan class="f2">Porto Alegre</tspan><tspan>.</tspan></text>
<circle cx="57" cy="625" r="10" class="f1-dot"/><text x="57" y="630" class="num" text-anchor="middle">1</text><text x="76" y="630" class="label">emotion named</text><circle cx="319" cy="625" r="10" class="f2-dot"/><text x="319" y="630" class="num" text-anchor="middle">2</text><text x="338" y="630" class="label">specific, not generic</text><circle cx="581" cy="625" r="10" class="f3-dot"/><text x="581" y="630" class="num" text-anchor="middle">3</text><text x="600" y="630" class="label">time jump, no lesson</text>
</svg>