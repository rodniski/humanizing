<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" role="img" aria-label="An AI-written answer with three structural tells highlighted, then the restructured version.">
<style>
    .card{fill:#151514;stroke:#2c2b28}
    .mono{font:14.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#ecebe6}
    .head{font:600 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#ecebe6}
    .sub{font:13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#8f8b82}
    .cap{font:600 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;letter-spacing:.12em;fill:#8f8b82}
    .label{font:13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#ecebe6}
    .num{font:700 10.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#151514}
    .rule{stroke:#2c2b28}
    .t1,.t2,.t3{fill:#e2805f}
    .f1,.f2,.f3{fill:#6fc2a8}
    .t1-dot,.t2-dot,.t3-dot{fill:#e2805f}
    .f1-dot,.f2-dot,.f3-dot{fill:#6fc2a8}
    .before-dim{opacity:.7}
    @keyframes in{from{opacity:0;transform:translateY(4px)}}
    @keyframes lit{from{fill:#ecebe6}}
    @keyframes dim{from{opacity:1}}
    .before-in{animation:in .6s ease-out .2s backwards}
    .t1{animation:lit .35s ease-out 1.2s backwards}
    .t2{animation:lit .35s ease-out 1.9s backwards}
    .t3{animation:lit .35s ease-out 2.6s backwards}
    .t1-tag{animation:in .35s ease-out 1.2s backwards}
    .t2-tag{animation:in .35s ease-out 1.9s backwards}
    .t3-tag{animation:in .35s ease-out 2.6s backwards}
    .before-dim{animation:dim .6s ease-out 3.4s backwards}
    .a0{animation:in .5s ease-out 3.8s backwards}
    .a1{animation:in .5s ease-out 4.05s backwards}
    .a2{animation:in .5s ease-out 4.3s backwards}
    .after-cap{animation:in .5s ease-out 3.6s backwards}
    .after-tags{animation:in .5s ease-out 4.8s backwards}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
    </style>
<rect class="card" x=".5" y=".5" width="879" height="449" rx="14"/>
<text x="48" y="50" class="head">humanizing</text>
<text x="832" y="50" class="sub" text-anchor="end">structure, not vocabulary</text>
<line class="rule" x1="48" x2="832" y1="70" y2="70"/>
<g class="before-in"><g class="before-dim">
<text x="48" y="102" class="cap">BEFORE</text>
<text x="48" y="132" class="mono"><tspan>I looked into the login timeouts. </tspan><tspan class="t1">First I checked the logs, then the load</tspan></text>
<text x="48" y="156" class="mono"><tspan class="t1">balancer, then the connection pool.</tspan><tspan class="t1" dy="-6" font-size="10">1</tspan><tspan class="t2" dy="6"> As experienced engineers often say, it's</tspan></text>
<text x="48" y="180" class="mono"><tspan class="t2">usually the simplest thing.</tspan><tspan class="t2" dy="-6" font-size="10">2</tspan><tspan dy="6"> In the end, it was the pool size. </tspan><tspan class="t3">Ultimately,</tspan></text>
<text x="48" y="204" class="mono"><tspan class="t3">this shows how small details can have a big impact on reliability.</tspan><tspan class="t3" dy="-6" font-size="10">3</tspan></text>
</g>
<g class="tag t1-tag"><circle cx="54" cy="238" r="8" class="t1-dot"/><text x="54" y="242" class="num" text-anchor="middle">1</text><text x="70" y="242" class="label">discovery order</text></g><g class="tag t2-tag"><circle cx="284" cy="238" r="8" class="t2-dot"/><text x="284" y="242" class="num" text-anchor="middle">2</text><text x="300" y="242" class="label">vague allusion</text></g><g class="tag t3-tag"><circle cx="514" cy="238" r="8" class="t3-dot"/><text x="514" y="242" class="num" text-anchor="middle">3</text><text x="530" y="242" class="label">moral at the end</text></g>
</g>
<line class="rule" x1="48" x2="832" y1="270" y2="270"/>
<text x="48" y="302" class="cap after-cap">AFTER</text>
<g class="a0"><text x="48" y="332" class="mono"><tspan class="f1">Login times out because the DB pool caps at 10</tspan><tspan class="f1" dy="-6" font-size="10">1</tspan><tspan dy="6"> (</tspan><tspan class="f2">config/db.go:42</tspan><tspan>).</tspan></text></g>
<g class="a1"><text x="48" y="356" class="mono"><tspan>Raised it to 50; p99 fell from </tspan><tspan class="f2">8.1 s</tspan><tspan> to </tspan><tspan class="f2">240 ms</tspan><tspan>.</tspan><tspan class="f2" dy="-6" font-size="10">2</tspan></text></g>
<g class="a2"><text x="48" y="380" class="mono"><tspan class="f3">Not checked:</tspan><tspan class="f3" dy="-6" font-size="10">3</tspan><tspan dy="6"> whether the cache hides the same limit under real load.</tspan></text></g>
<g class="after-tags"><g class="tag f1-tag"><circle cx="54" cy="414" r="8" class="f1-dot"/><text x="54" y="418" class="num" text-anchor="middle">1</text><text x="70" y="418" class="label">conclusion first</text></g><g class="tag f2-tag"><circle cx="284" cy="414" r="8" class="f2-dot"/><text x="284" y="418" class="num" text-anchor="middle">2</text><text x="300" y="418" class="label">named, not alluded</text></g><g class="tag f3-tag"><circle cx="514" cy="414" r="8" class="f3-dot"/><text x="514" y="418" class="num" text-anchor="middle">3</text><text x="530" y="418" class="label">open end, stated</text></g></g>
</svg>