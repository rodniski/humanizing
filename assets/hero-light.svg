<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 562" width="880" height="562" role="img" aria-label="An AI-written answer with three structural tells highlighted, then the restructured version.">
<style>
    .card{fill:#fbfaf7;stroke:#e4e1da}
    .mono{font:17px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#1c1b19}
    .cap{font:600 12.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;letter-spacing:.12em;fill:#8a857c}
    .sub{font:14px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#8a857c}
    .label{font:15.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#1c1b19}
    .num{font:700 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#fbfaf7}
    .rule{stroke:#e4e1da}
    .t1,.t2,.t3{fill:#b4442a}
    .f1,.f2,.f3{fill:#2f6f5e}
    .t1-dot,.t2-dot,.t3-dot{fill:#b4442a}
    .f1-dot,.f2-dot,.f3-dot{fill:#2f6f5e}
    .before{opacity:.72}
    @keyframes ink{from{fill:#1c1b19}}
    @keyframes off{from{fill:#e4e1da}}
    @keyframes dim{from{opacity:1}}
    .t1,.t1-dot{animation:ink .35s ease-out .8s backwards}
    .t2,.t2-dot{animation:ink .35s ease-out 1.5s backwards}
    .t3,.t3-dot{animation:ink .35s ease-out 2.2s backwards}
    .before{animation:dim .6s ease-out 3s backwards}
    .f1,.f1-dot{animation:ink .35s ease-out 3.5s backwards}
    .f2,.f2-dot{animation:ink .35s ease-out 4.1s backwards}
    .f3,.f3-dot{animation:ink .35s ease-out 4.7s backwards}
    .t1-dot,.t2-dot,.t3-dot,.f1-dot,.f2-dot,.f3-dot{animation-name:off}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
    </style>
<rect class="card" x=".5" y=".5" width="879" height="561" rx="14"/>
<text x="48" y="58" class="cap">BEFORE</text>
<text x="832" y="58" class="sub" text-anchor="end">structure, not vocabulary</text>
<g class="before">
<text x="48" y="104" class="mono"><tspan>I looked into the login timeouts. </tspan><tspan class="t1">First I checked the logs,</tspan></text>
<text x="48" y="134" class="mono"><tspan class="t1">then the load balancer, then the connection pool.</tspan><tspan class="t1" dy="-7" font-size="12">1</tspan><tspan class="t2" dy="7"> As experienced</tspan></text>
<text x="48" y="164" class="mono"><tspan class="t2">engineers often say, it's usually the simplest thing.</tspan><tspan class="t2" dy="-7" font-size="12">2</tspan><tspan dy="7"> In the end,</tspan></text>
<text x="48" y="194" class="mono"><tspan>it was the pool size. </tspan><tspan class="t3">Ultimately, this shows how small details</tspan></text>
<text x="48" y="224" class="mono"><tspan class="t3">can have a big impact on reliability.</tspan><tspan class="t3" dy="-7" font-size="12">3</tspan></text>
</g>
<circle cx="57" cy="285" r="10" class="t1-dot"/><text x="57" y="290" class="num" text-anchor="middle">1</text><text x="76" y="290" class="label">discovery order</text><circle cx="319" cy="285" r="10" class="t2-dot"/><text x="319" y="290" class="num" text-anchor="middle">2</text><text x="338" y="290" class="label">vague allusion</text><circle cx="581" cy="285" r="10" class="t3-dot"/><text x="581" y="290" class="num" text-anchor="middle">3</text><text x="600" y="290" class="label">moral at the end</text>
<line class="rule" x1="48" x2="832" y1="316" y2="316"/>
<text x="48" y="354" class="cap">AFTER</text>
<text x="48" y="384" class="mono"><tspan class="f1">Login times out because the DB pool caps at 10.</tspan><tspan class="f1" dy="-7" font-size="12">1</tspan></text>
<text x="48" y="414" class="mono"><tspan>Raised it to 50 (</tspan><tspan class="f2">config/db.go:42</tspan><tspan>); p99 fell from </tspan><tspan class="f2">8.1 s</tspan></text>
<text x="48" y="444" class="mono"><tspan>to </tspan><tspan class="f2">240 ms</tspan><tspan>.</tspan><tspan class="f2" dy="-7" font-size="12">2</tspan><tspan dy="7"> </tspan><tspan class="f3">Not checked:</tspan><tspan class="f3" dy="-7" font-size="12">3</tspan><tspan dy="7"> whether the cache hides</tspan></text>
<text x="48" y="474" class="mono"><tspan>the same limit under real load.</tspan></text>
<circle cx="57" cy="535" r="10" class="f1-dot"/><text x="57" y="540" class="num" text-anchor="middle">1</text><text x="76" y="540" class="label">conclusion first</text><circle cx="319" cy="535" r="10" class="f2-dot"/><text x="319" y="540" class="num" text-anchor="middle">2</text><text x="338" y="540" class="label">named, not alluded</text><circle cx="581" cy="535" r="10" class="f3-dot"/><text x="581" y="540" class="num" text-anchor="middle">3</text><text x="600" y="540" class="label">open end, stated</text>
</svg>